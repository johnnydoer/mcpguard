name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Validate example policies offline
        run: |
          go build -o mcpguard ./cmd/mcpguard
          for policy in examples/*/mcpguard.yaml; do
            ./mcpguard validate --policy "$policy" --offline
          done
          ./mcpguard test --fuzz examples/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2

  fuzz:
    # Bounded fuzz run on every PR. Not a substitute for long local runs, but it
    # catches a regression that reintroduces a known bypass within the minute.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make fuzz
